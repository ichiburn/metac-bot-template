name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # [local patch] Non-secret switches. Set them under Settings --> Secrets and variables --> Actions --> Variables.
          # Unset variables fall back to the defaults after "||".
          # MiniBench: default off. To join from 2026-11-02 09:00 JST, set repository variable ENABLE_MINIBENCH=true on 11/01.
          ENABLE_MINIBENCH: ${{ vars.ENABLE_MINIBENCH || 'false' }}
          # Variant: V0 | V1 | V2 | V3 | V4 | V5 | TEMPLATE (see CHANGES.md)
          BOT_VARIANT: ${{ vars.BOT_VARIANT || 'V0' }}
          # Spending cap per run (USD) enforced with MonetaryCostManager
          BOT_MAX_COST_USD: ${{ vars.BOT_MAX_COST_USD || '1.00' }}
          # Optional model overrides (empty = defaults in bot_config.py)
          BOT_CHEAP_MODEL: ${{ vars.BOT_CHEAP_MODEL }}
          BOT_STRONG_MODEL: ${{ vars.BOT_STRONG_MODEL }}
          BOT_RESEARCHER: ${{ vars.BOT_RESEARCHER }}
